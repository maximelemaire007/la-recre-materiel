<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#131A2E;--red:#E5303A;--paper:#F7F5F1}
*{box-sizing:border-box;margin:0}
body{font-family:Outfit,sans-serif;background:#999;padding:20px;display:flex;gap:20px}
.pf{width:800px;height:800px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.navy{background:var(--navy)}.light{background:var(--paper)}
.ring{position:absolute;left:0;top:0}
.wm{display:flex;align-items:flex-start;position:relative;transform:scale(.66);margin-left:-4px;margin-top:19px}
.vingt{font-weight:700;font-size:250px;line-height:1;letter-spacing:-.045em;position:relative}
.navy .vingt{color:#F7F5F1}.light .vingt{color:var(--navy)}
.n55{font-weight:800;font-size:250px;line-height:1;letter-spacing:-.05em;color:var(--red);margin-left:6px;margin-top:62px}
.sub{position:absolute;left:12px;top:230px;font-weight:800;font-size:32px;letter-spacing:.15em;color:var(--red);text-transform:uppercase}
.ii{position:relative;display:inline-block}
.dot{position:absolute;border-radius:50%;background:var(--red);left:calc(50% + var(--dx,6.2px));top:38px;width:40px;height:40px;transform:translateX(-50%)}
.waves{position:absolute;left:calc(50% + var(--dx,6.2px));top:-12px;transform:translateX(-50%)}
.mt{position:absolute;left:10px;top:-6px;font-weight:600;font-size:33px;letter-spacing:.24em;color:var(--red);text-transform:uppercase;line-height:1;white-space:nowrap}
</style></head><body>
<div class="pf navy" id="pA">
  <svg class="ring" width="800" height="800" viewBox="0 0 800 800" fill="none" stroke-linecap="round">
    <!-- r=330, circumference ≈ 2073 ; gap centred at 12 o clock, red arc just after the gap -->
    <circle cx="400" cy="400" r="330" stroke="#F7F5F1" stroke-width="16" stroke-dasharray="1830 243" transform="rotate(-68.9 400 400)"/>
    <circle cx="400" cy="400" r="330" stroke="#E5303A" stroke-width="16" stroke-dasharray="170 1903" transform="rotate(-57.9 400 400)"/>
  </svg>
  <div class="wm">
    <div class="vingt">v<span class="ii">&#x131;<span class="dot"></span><svg class="waves" width="140" height="140" viewBox="0 0 140 140" fill="none" stroke="#E5303A" stroke-width="7" stroke-linecap="round"><path d="M43.1 43.1 A38 38 0 0 1 96.9 43.1"/><path d="M30.4 30.4 A56 56 0 0 1 109.6 30.4" stroke-width="6"/></svg></span>ngt</div>
    <div class="n55">55</div>
    <div class="sub">Communauté</div>
  </div>
</div>
<div class="pf light" id="pB">
  <svg class="ring" width="800" height="800" viewBox="0 0 800 800" fill="none" stroke-linecap="round">
    <circle cx="400" cy="400" r="330" stroke="#131A2E" stroke-width="16" stroke-dasharray="1830 243" transform="rotate(-68.9 400 400)"/>
    <circle cx="400" cy="400" r="330" stroke="#E5303A" stroke-width="16" stroke-dasharray="170 1903" transform="rotate(-57.9 400 400)"/>
  </svg>
  <div class="wm">
    <div class="vingt">v<span class="ii">&#x131;<span class="dot"></span><svg class="waves" width="140" height="140" viewBox="0 0 140 140" fill="none" stroke="#E5303A" stroke-width="7" stroke-linecap="round"><path d="M43.1 43.1 A38 38 0 0 1 96.9 43.1"/><path d="M30.4 30.4 A56 56 0 0 1 109.6 30.4" stroke-width="6"/></svg></span>ngt</div>
    <div class="n55">55</div>
    <div class="sub">Communauté</div>
  </div>
</div>
</body></html>
