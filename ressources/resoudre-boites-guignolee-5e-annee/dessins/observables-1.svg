<svg xmlns='http://www.w3.org/2000/svg' width='722' height='576.5' viewBox='-1 -1 722 576.5'><rect x='-1' y='-1' width='722' height='576.5' fill='#fff'/><rect x='0' y='0' width='720' height='86' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><rect x='0' y='0' width='720' height='18' fill='#1E1E1E'/><text x='710' y='14' font-family='KG Perfect Penmanship' font-size='13' text-anchor='end' fill='#fff' stroke='#fff' stroke-width='0.5'>5e année</text><text x='360.0' y='42' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='15' text-anchor='middle' fill='#1E1E1E'>Éléments observables</text><text x='360.0' y='72' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='1' font-size='24' text-anchor='middle' fill='#1E1E1E'>Les boîtes de la guignolée</text><rect x='0' y='86' width='720' height='488.5' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><line x1='190' y1='86' x2='190' y2='574.5' stroke='#1E1E1E' stroke-width='1.5'/><text x='204' y='104' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'  font-style="italic">L’élève comprend qu’elle, qu’il…</text><text x='204' y='137.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >doit déterminer le nombre de boîtes à préparer en tenant compte :</text><rect x='204' y='149.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='160.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>du nombre de denrées amassées par chaque classe (diagramme à</text><text x='224' y='181.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>bandes)</text><rect x='204' y='193.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='204.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>du 1/8 des denrées qui sont périmées et qu’il faut retirer</text><rect x='204' y='216.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='227.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des 8 denrées par boîte et des boîtes complètes seulement</text><text x='204' y='261.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >doit déterminer le coût de la préparation des boîtes en tenant compte :</text><path d='M204 279.0 L216 284.5 L204 290.0 L207.5 284.5 Z' fill='#1E1E1E'/><text x='224' y='290.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les boîtes</text><rect x='204' y='303.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='314.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des prix des trois fournisseurs (à l’unité, paquets de 5, paquets de 10)</text><path d='M204 332.0 L216 337.5 L204 343.0 L207.5 337.5 Z' fill='#1E1E1E'/><text x='224' y='343.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Le ruban</text><rect x='204' y='356.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='367.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>de la taille de la boîte (35 cm × 25 cm) et des 45 cm pour la boucle</text><rect x='204' y='379.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='390.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des rouleaux de 10 m à 5 $ et d’un ruban d’un seul morceau</text><path d='M204 408.0 L216 413.5 L204 419.0 L207.5 413.5 Z' fill='#1E1E1E'/><text x='224' y='419.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les étiquettes</text><rect x='204' y='432.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='443.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des contraintes : un quadrilatère, une seule paire de côtés parallèles, une</text><text x='224' y='464.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>aire de 10 carrés ou plus</text><rect x='204' y='476.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='487.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>d’une étiquette par boîte et des paquets de 8</text><text x='204' y='520.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >doit déterminer l’argent qui restera en tenant compte :</text><rect x='204' y='532.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='543.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des 200 $ donnés par les parents</text><text x='95.0' y='324.25' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>Compréhension de la</text><text x='95.0' y='346.25' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>situation-problème</text></svg>