<svg xmlns='http://www.w3.org/2000/svg' width='722' height='758.5' viewBox='-1 -1 722 758.5'><rect x='-1' y='-1' width='722' height='758.5' fill='#fff'/><rect x='0' y='0' width='720' height='647.5' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><line x1='190' y1='0' x2='190' y2='647.5' stroke='#1E1E1E' stroke-width='1.5'/><text x='204' y='18' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'  font-style="italic">L’élève…</text><text x='204' y='51.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >établit le bon nombre de boîtes :</text><rect x='204' y='63.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='74.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>denrées amassées (lecture du diagramme. Ex. : 125 + 110 + 115 + 130 = 480)</text><rect x='204' y='86.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='97.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>denrées périmées (à l’aide de processus personnels. Ex. : 480 à séparer</text><text x='224' y='118.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>en 8 = 60)</text><rect x='204' y='130.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='141.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>denrées à donner (Ex. : 480 – 60 = 420)</text><rect x='204' y='153.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='164.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>boîtes (Ex. : 420 ÷ 8 = 52 reste 4, donc 52 boîtes complètes)</text><text x='204' y='198.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >établit le coût de la préparation :</text><path d='M204 216.0 L216 221.5 L204 227.0 L207.5 221.5 Z' fill='#1E1E1E'/><text x='224' y='227.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les boîtes</text><rect x='204' y='240.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='251.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>fournisseur A : 52 × 2 $ = 104 $</text><rect x='204' y='263.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='274.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>fournisseur B : 52 ÷ 5 = 10 reste 2, donc 11 paquets; 11 × 9 $ = 99 $</text><rect x='204' y='286.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='297.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>fournisseur C : 52 ÷ 10 = 5 reste 2, donc 6 paquets; 6 × 18 $ = 108 $</text><rect x='204' y='309.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='320.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>choix du fournisseur le moins cher : B, 99 $</text><path d='M204 338.0 L216 343.5 L204 349.0 L207.5 343.5 Z' fill='#1E1E1E'/><text x='224' y='349.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Le ruban</text><rect x='204' y='362.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='373.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>ruban pour une boîte (Ex. : 35 + 25 + 35 + 25 = 120 cm; 120 + 45 = 165 cm</text><text x='224' y='394.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>= 1,65 m)</text><rect x='204' y='406.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='417.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>boîtes par rouleau (10 m = 1000 cm; 165 × 6 = 990 cm, donc 6 boîtes)</text><rect x='204' y='429.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='440.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>rouleaux (Ex. : 52 ÷ 6 = 8 reste 4, donc 9 rouleaux; 9 × 5 $ = 45 $)</text><path d='M204 458.0 L216 463.5 L204 469.0 L207.5 463.5 Z' fill='#1E1E1E'/><text x='224' y='469.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les étiquettes</text><rect x='204' y='482.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='493.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>choix de l’étiquette 4, le grand trapèze (une seule paire de côtés</text><text x='224' y='514.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>parallèles, aire de 12 carrés)</text><rect x='204' y='526.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='537.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>paquets (Ex. : 52 ÷ 8 = 6 reste 4, donc 7 paquets; 7 × 3 $ = 21 $)</text><text x='204' y='570.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >établit le coût total et l’argent qui reste :</text><rect x='204' y='582.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='593.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>coût de la préparation (Ex. : 99 $ + 45 $ + 21 $ = 165 $)</text><rect x='204' y='605.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='616.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>argent qui reste (Ex. : 200 $ – 165 $ = 35 $)</text><text x='95.0' y='317.75' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>Mobilisation des</text><text x='95.0' y='339.75' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>concepts et processus</text><rect x='0' y='663.5' width='720' height='93.0' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><line x1='190' y1='663.5' x2='190' y2='756.5' stroke='#1E1E1E' stroke-width='1.5'/><rect x='204' y='670.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='681.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>Laisse des traces de chacune des étapes</text><rect x='204' y='693.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='704.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>La solution comprend le nombre de boîtes (52), le coût de la préparation</text><text x='224' y='725.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>(165 $) et l’argent qui reste (35 $)</text><text x='95.0' y='693.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>Explicitation des</text><text x='95.0' y='715.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>éléments pertinents de</text><text x='95.0' y='737.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>la solution</text></svg>