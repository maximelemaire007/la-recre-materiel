<svg xmlns='http://www.w3.org/2000/svg' width='720' height='586' viewBox='0 0 720 586'><rect width='720' height='586' fill='#fff'/><rect x='1.5' y='1.5' width='717' height='583' rx='16' fill='none' stroke='#1E1E1E' stroke-width='2.4'/><rect x='12' y='18' width='696' height='50' rx='8' fill='#F2F2F2'/><rect x='28' y='30' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='50' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai donné un titre à mon histoire.</text><rect x='28' y='80' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='100' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai présenté mes personnages et le lieu.</text><rect x='12' y='118' width='696' height='50' rx='8' fill='#F2F2F2'/><rect x='28' y='130' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='150' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai expliqué clairement la catastrophe.</text><rect x='28' y='180' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='200' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai écrit au moins deux péripéties.</text><rect x='12' y='218' width='696' height='50' rx='8' fill='#F2F2F2'/><rect x='28' y='230' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='250' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai expliqué comment le problème est réglé.</text><rect x='28' y='280' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='300' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai organisé mon histoire en paragraphes.</text><rect x='12' y='318' width='696' height='50' rx='8' fill='#F2F2F2'/><rect x='28' y='330' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='350' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai utilisé des marqueurs de relation.</text><rect x='28' y='380' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='400' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >Mes phrases commencent par une majuscule et se terminent par une ponctuation.</text><rect x='12' y='418' width='696' height='50' rx='8' fill='#F2F2F2'/><rect x='28' y='430' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='450' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai vérifié les accords dans mes groupes du nom.</text><rect x='28' y='480' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='500' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai vérifié les accords entre le sujet et le verbe.</text><rect x='12' y='518' width='696' height='50' rx='8' fill='#F2F2F2'/><rect x='28' y='530' width='24' height='24' rx='3' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='68' y='550' font-family='KG Perfect Penmanship' font-size='17' text-anchor='start' fill='#1E1E1E' >J’ai vérifié l’orthographe des mots.</text></svg>