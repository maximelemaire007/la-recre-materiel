<svg xmlns='http://www.w3.org/2000/svg' width='720' height='212' viewBox='0 0 720 212'><rect width='720' height='212' fill='#fff'/><rect x='1.0' y='1' width='348.0' height='210' rx='16' fill='#fff' stroke='#1E1E1E' stroke-width='2.4'/><rect x='17.0' y='18' width='22' height='22' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='49.0' y='37' font-family='KG Perfect Penmanship' font-size='18' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Choix 1</text><text x='175.0' y='78' font-family='KG Perfect Penmanship' font-size='17' text-anchor='middle' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Les cadeaux ont disparu!</text><text x='175.0' y='116' font-family='KG Perfect Penmanship' font-size='15' text-anchor='middle' fill='#1E1E1E' >Un matin, les lutins découvrent</text><text x='175.0' y='140' font-family='KG Perfect Penmanship' font-size='15' text-anchor='middle' fill='#1E1E1E' >que tous les cadeaux préparés</text><text x='175.0' y='164' font-family='KG Perfect Penmanship' font-size='15' text-anchor='middle' fill='#1E1E1E' >pour Noël ont mystérieusement</text><text x='175.0' y='188' font-family='KG Perfect Penmanship' font-size='15' text-anchor='middle' fill='#1E1E1E' >disparu!</text><rect x='371.0' y='1' width='348.0' height='210' rx='16' fill='#fff' stroke='#1E1E1E' stroke-width='2.4'/><rect x='387.0' y='18' width='22' height='22' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><text x='419.0' y='37' font-family='KG Perfect Penmanship' font-size='18' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Choix 2</text><text x='545.0' y='78' font-family='KG Perfect Penmanship' font-size='17' text-anchor='middle' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>La machine à jouets est brisée!</text><text x='545.0' y='116' font-family='KG Perfect Penmanship' font-size='15' text-anchor='middle' fill='#1E1E1E' >À quelques jours de Noël,</text><text x='545.0' y='140' font-family='KG Perfect Penmanship' font-size='15' text-anchor='middle' fill='#1E1E1E' >la machine qui fabrique tous</text><text x='545.0' y='164' font-family='KG Perfect Penmanship' font-size='15' text-anchor='middle' fill='#1E1E1E' >les jouets tombe soudainement</text><text x='545.0' y='188' font-family='KG Perfect Penmanship' font-size='15' text-anchor='middle' fill='#1E1E1E' >en panne!</text></svg>