ignant ou mon enseignante :</text><rect x='18' y='714' width='16' height='16' fill='#fff' stroke='#1E1E1E' stroke-width='1.6'/><text x='42' y='728' font-family='KG Perfect Penmanship' font-size='14' text-anchor='start' fill='#1E1E1E' >Oui, tu peux écrire ton brouillon!</text><rect x='281.7590625' y='714' width='16' height='16' fill='#fff' stroke='#1E1E1E' stroke-width='1.6'/><text x='305.7590625' y='728' font-family='KG Perfect Penmanship' font-size='14' text-anchor='start' fill='#1E1E1E' >À retravailler</text><text x='550' y='728' font-family='KG Perfect Penmanship' font-size='14' text-anchor='start' fill='#1E1E1E' >Initiales :</text><line x1='620' y1='730' x2='702' y2='730' stroke='#1E1E1E' stroke-width='1.4'/></svg>