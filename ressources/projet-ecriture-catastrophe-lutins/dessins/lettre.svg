<svg xmlns='http://www.w3.org/2000/svg' width='720' height='534' viewBox='0 0 720 534'><rect width='720' height='534' fill='#fff'/><rect x='3' y='3' width='714' height='528' rx='22' fill='#fff' stroke='#1E1E1E' stroke-width='3'/><rect x='14' y='14' width='692' height='506' rx='14' fill='none' stroke='#D9D9D9' stroke-width='3'/><text x='44' y='70' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >Chers élèves,</text><text x='44' y='114' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >J’ai besoin de votre aide!</text><text x='44' y='158' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >Une terrible catastrophe vient de se produire au village des lutins. Les</text><text x='44' y='188' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >préparatifs de Noël sont complètement bouleversés et nous avons très</text><text x='44' y='218' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >peu de temps pour régler la situation.</text><text x='44' y='262' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >J’ai entendu dire que vous étiez de bons écrivains et que vous aviez</text><text x='44' y='292' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >beaucoup d’imagination. Je vous confie donc une mission très</text><text x='44' y='322' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >importante : inventer une histoire pour raconter cette catastrophe et</text><text x='44' y='352' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >expliquer comment les lutins réussiront à sauver Noël!</text><text x='44' y='396' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >Attention, votre histoire devra avoir un début, un milieu et une fin.</text><text x='44' y='440' font-family='KG Perfect Penmanship' font-size='19' text-anchor='start' fill='#1E1E1E' >J’ai confiance en vous!</text><text x='676' y='494' font-family='KG Perfect Penmanship' font-size='22' text-anchor='end' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Le chef des lutins</text></svg>