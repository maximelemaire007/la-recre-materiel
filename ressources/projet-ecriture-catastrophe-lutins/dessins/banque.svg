<svg xmlns='http://www.w3.org/2000/svg' width='720' height='566' viewBox='0 0 720 566'><rect width='720' height='566' fill='#fff'/><rect x='1' y='1' width='718' height='563' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><rect x='1' y='1' width='718' height='38' fill='#D9D9D9' stroke='#1E1E1E' stroke-width='2'/><text x='95.0' y='27' font-family='KG Perfect Penmanship' font-size='17' text-anchor='middle' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Catégorie</text><text x='455.0' y='27' font-family='KG Perfect Penmanship' font-size='17' text-anchor='middle' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Exemples</text><line x1='1' y1='39' x2='719' y2='39' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='81.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Personnages</text><text x='204' y='70.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >lutin, lutine, apprenti lutin, chef des lutins, père Noël, mère Noël, renne,</text><text x='204' y='91.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >bonhomme de neige, ours polaire, harfang des neiges</text><line x1='1' y1='111' x2='719' y2='111' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='153.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Moments</text><text x='204' y='142.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >la veille de Noël, un matin glacial, une nuit étoilée, à minuit, le 1er</text><text x='204' y='163.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >décembre, pendant une tempête de neige</text><line x1='1' y1='183' x2='719' y2='183' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='225.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Lieux</text><text x='204' y='214.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >atelier, village, forêt enneigée, entrepôt, traîneau, pôle Nord, écurie des</text><text x='204' y='235.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >rennes, salle d’emballage, montagne glacée, cheminée</text><line x1='1' y1='255' x2='719' y2='255' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='297.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Verbes</text><text x='204' y='286.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >fabriquer, découvrir, réparer, chercher, courir, cacher, emballer,</text><text x='204' y='307.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >s’écrier, chuchoter, glisser, grimper, inventer, aider, sauver</text><line x1='1' y1='327' x2='719' y2='327' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='369.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Adjectifs</text><text x='204' y='358.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >mystérieux, immense, minuscule, magique, brillant, scintillant, enneigé,</text><text x='204' y='379.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >gigantesque, étrange, courageux, rusé, joyeux</text><line x1='1' y1='399' x2='719' y2='399' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='441.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Émotions</text><text x='204' y='430.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >paniqué, surpris, inquiet, découragé, nerveux, furieux, triste, déterminé,</text><text x='204' y='451.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >soulagé, heureux, fier, émerveillé</text><line x1='1' y1='471' x2='719' y2='471' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='523.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Marqueurs de relation</text><text x='204' y='502.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >d’abord, au début, un jour, soudain, tout à coup, ensuite, puis, par la</text><text x='204' y='523.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >suite, après, aussi, d’ailleurs, par ailleurs, pendant ce temps, quelques</text><text x='204' y='544.5' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >minutes plus tard, heureusement, malheureusement, enfin, finalement</text><line x1='190' y1='1' x2='190' y2='564' stroke='#1E1E1E' stroke-width='1.4'/></svg>