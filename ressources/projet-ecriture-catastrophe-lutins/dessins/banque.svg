<svg xmlns='http://www.w3.org/2000/svg' width='720' height='437' viewBox='0 0 720 437'><rect width='720' height='437' fill='#fff'/><rect x='1' y='1' width='718' height='434' fill='#fff' stroke='#1E1E1E' stroke-width='2'/><rect x='1' y='1' width='718' height='38' fill='#D9D9D9' stroke='#1E1E1E' stroke-width='2'/><text x='95.0' y='27' font-family='KG Perfect Penmanship' font-size='17' text-anchor='middle' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Catégorie</text><text x='455.0' y='27' font-family='KG Perfect Penmanship' font-size='17' text-anchor='middle' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Exemples</text><line x1='1' y1='39' x2='719' y2='39' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='78.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Personnages</text><text x='204' y='78.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >lutin, lutine, père Noël, mère Noël, renne, apprenti, chef des lutins</text><line x1='1' y1='105' x2='719' y2='105' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='144.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Lieux</text><text x='204' y='144.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >atelier, village, forêt enneigée, entrepôt, traîneau, pôle Nord</text><line x1='1' y1='171' x2='719' y2='171' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='210.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Verbes</text><text x='204' y='210.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >fabriquer, découvrir, réparer, chercher, courir, cacher, emballer</text><line x1='1' y1='237' x2='719' y2='237' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='276.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Adjectifs</text><text x='204' y='276.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >mystérieux, immense, minuscule, inquiet, magique, brillant</text><line x1='1' y1='303' x2='719' y2='303' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='342.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Émotions</text><text x='204' y='342.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >paniqué, surpris, découragé, soulagé, heureux, fier</text><line x1='1' y1='369' x2='719' y2='369' stroke='#1E1E1E' stroke-width='1.4'/><text x='16' y='408.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' stroke='#1E1E1E' stroke-width='0.7'>Marqueurs de relation</text><text x='204' y='398.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >soudain, ensuite, quelques minutes plus tard, pendant ce temps,</text><text x='204' y='418.0' font-family='KG Perfect Penmanship' font-size='15' text-anchor='start' fill='#1E1E1E' >finalement</text><line x1='190' y1='1' x2='190' y2='435' stroke='#1E1E1E' stroke-width='1.4'/></svg>