<svg xmlns='http://www.w3.org/2000/svg' width='722' height='779.5' viewBox='-1 -1 722 779.5'><rect x='-1' y='-1' width='722' height='779.5' fill='#fff'/><rect x='0' y='0' width='720' height='668.5' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><line x1='190' y1='0' x2='190' y2='668.5' stroke='#1E1E1E' stroke-width='1.5'/><text x='204' y='18' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'  font-style="italic">L’élève…</text><text x='204' y='51.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >établit le bon nombre de paniers :</text><rect x='204' y='63.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='74.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>denrées amassées (lecture du diagramme. Ex. : 48 + 62 + 56 + 58 = 224)</text><rect x='204' y='86.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='97.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>denrées périmées (à l’aide de processus personnels. Ex. : 224 à séparer</text><text x='224' y='118.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>en 4 = 56)</text><rect x='204' y='130.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='141.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>denrées à donner (Ex. : 224 – 56 = 168)</text><rect x='204' y='153.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='164.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>paniers (à l’aide de processus personnels. Ex. : 168 à séparer en paquets</text><text x='224' y='185.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>de 8 = 21)</text><text x='204' y='219.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >établit le coût de la préparation :</text><path d='M204 237.0 L216 242.5 L204 248.0 L207.5 242.5 Z' fill='#1E1E1E'/><text x='224' y='248.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les boîtes</text><rect x='204' y='261.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='272.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>fournisseur A : 21 × 2 $ = 42 $</text><rect x='204' y='284.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='295.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>fournisseur B : 5 paquets de 5 (25 boîtes) × 8 $ = 40 $</text><rect x='204' y='307.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='318.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>fournisseur C : 3 paquets de 10 (30 boîtes) × 19 $ = 57 $</text><rect x='204' y='330.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='341.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>choix du fournisseur le moins cher : B, 40 $</text><path d='M204 359.0 L216 364.5 L204 370.0 L207.5 364.5 Z' fill='#1E1E1E'/><text x='224' y='370.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Le ruban</text><rect x='204' y='383.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='394.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>périmètre du dessus de la boîte (Ex. : 30 + 20 + 30 + 20 = 100 cm)</text><rect x='204' y='406.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='417.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>ruban pour une boîte (Ex. : 100 cm + 50 cm = 150 cm)</text><rect x='204' y='429.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='440.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>boîtes par rouleau (5 m = 500 cm; 150 + 150 + 150 = 450 cm, donc 3</text><text x='224' y='461.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>boîtes)</text><rect x='204' y='473.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='484.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>rouleaux (Ex. : 21 ÷ 3 = 7 rouleaux; 7 × 3 $ = 21 $)</text><path d='M204 502.0 L216 507.5 L204 513.0 L207.5 507.5 Z' fill='#1E1E1E'/><text x='224' y='513.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les étiquettes</text><rect x='204' y='526.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='537.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>choix de l’étiquette 3, le losange (4 côtés de même longueur, aucun angle</text><text x='224' y='558.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>droit)</text><rect x='204' y='570.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='581.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>paquets (Ex. : 21 ÷ 6 = 3 reste 3, donc 4 paquets; 4 × 2 $ = 8 $)</text><text x='204' y='614.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >établit le coût total :</text><rect x='204' y='626.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='637.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>coût de la préparation (Ex. : 40 $ + 21 $ + 8 $ = 69 $)</text><text x='95.0' y='328.25' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>Mobilisation des</text><text x='95.0' y='350.25' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>concepts et processus</text><rect x='0' y='684.5' width='720' height='93.0' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><line x1='190' y1='684.5' x2='190' y2='777.5' stroke='#1E1E1E' stroke-width='1.5'/><rect x='204' y='691.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='702.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>Laisse des traces de chacune des étapes</text><rect x='204' y='714.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='725.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>La solution comprend le nombre de paniers (21) et le coût de la</text><text x='224' y='746.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>préparation des paniers (69 $)</text><text x='95.0' y='714.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>Explicitation des</text><text x='95.0' y='736.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>éléments pertinents de</text><text x='95.0' y='758.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>la solution</text></svg>