<svg xmlns='http://www.w3.org/2000/svg' width='722' height='589.0' viewBox='-1 -1 722 589.0'><rect x='-1' y='-1' width='722' height='589.0' fill='#fff'/><rect x='0' y='0' width='720' height='86' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><rect x='0' y='0' width='720' height='18' fill='#1E1E1E'/><text x='710' y='14' font-family='KG Perfect Penmanship' font-size='13' text-anchor='end' fill='#fff' stroke='#fff' stroke-width='0.5'>4e année</text><text x='360.0' y='42' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='15' text-anchor='middle' fill='#1E1E1E'>Éléments observables</text><text x='360.0' y='72' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='1' font-size='24' text-anchor='middle' fill='#1E1E1E'>Les paniers de la guignolée</text><rect x='0' y='86' width='720' height='501.0' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><line x1='190' y1='86' x2='190' y2='587.0' stroke='#1E1E1E' stroke-width='1.5'/><text x='204' y='104' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'  font-style="italic">L’élève comprend qu’elle, qu’il…</text><text x='204' y='137.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >doit déterminer le nombre de paniers à préparer en tenant compte :</text><rect x='204' y='149.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='160.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>du nombre de denrées amassées par chaque classe (diagramme à</text><text x='224' y='181.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>bandes)</text><rect x='204' y='193.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='204.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>du quart des denrées qui sont périmées et qu’il faut retirer</text><rect x='204' y='216.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='227.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des 8 denrées par panier</text><rect x='204' y='239.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='250.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des paniers complets seulement</text><text x='204' y='284.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >doit déterminer le coût de la préparation des paniers en tenant compte :</text><path d='M204 302.0 L216 307.5 L204 313.0 L207.5 307.5 Z' fill='#1E1E1E'/><text x='224' y='313.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les boîtes</text><rect x='204' y='326.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='337.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>d’une boîte par panier</text><rect x='204' y='349.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='360.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des prix des trois fournisseurs (à l’unité, paquets de 5, paquets de 10)</text><path d='M204 378.0 L216 383.5 L204 389.0 L207.5 383.5 Z' fill='#1E1E1E'/><text x='224' y='389.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Le ruban</text><rect x='204' y='402.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='413.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>de la taille de la boîte (30 cm × 20 cm)</text><rect x='204' y='425.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='436.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des 50 cm de plus pour la boucle et d’un ruban d’un seul morceau</text><rect x='204' y='448.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='459.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des rouleaux de 5 m à 3 $</text><path d='M204 477.0 L216 482.5 L204 488.0 L207.5 482.5 Z' fill='#1E1E1E'/><text x='224' y='488.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les étiquettes</text><rect x='204' y='501.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='512.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>des contraintes : un quadrilatère, 4 côtés de même longueur, aucun</text><text x='224' y='533.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>angle droit</text><rect x='204' y='545.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='556.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>d’une étiquette par panier et des paquets de 6</text><text x='95.0' y='330.5' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>Compréhension de la</text><text x='95.0' y='352.5' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>situation-problème</text></svg>