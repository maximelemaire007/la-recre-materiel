<svg xmlns='http://www.w3.org/2000/svg' width='722' height='714.5' viewBox='-1 -1 722 714.5'><rect x='-1' y='-1' width='722' height='714.5' fill='#fff'/><rect x='0' y='0' width='720' height='603.5' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><line x1='190' y1='0' x2='190' y2='603.5' stroke='#1E1E1E' stroke-width='1.5'/><text x='204' y='18' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'  font-style="italic">L’élève…</text><text x='204' y='51.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >établit le bon nombre de boîtes :</text><rect x='204' y='63.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='74.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>denrées amassées (lecture du diagramme. Ex. : 22 + 18 + 26 + 14 = 80)</text><rect x='204' y='86.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='97.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>denrées à donner (Ex. : 80 – 20 = 60)</text><rect x='204' y='109.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='120.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>boîtes (à l’aide de processus personnels. Ex. : 60 à séparer en paquets</text><text x='224' y='141.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>de 6 = 10)</text><text x='204' y='175.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >établit le coût de la préparation :</text><path d='M204 193.0 L216 198.5 L204 204.0 L207.5 198.5 Z' fill='#1E1E1E'/><text x='224' y='204.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les boîtes</text><rect x='204' y='217.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='228.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>fournisseur A : 10 × 3 $ = 30 $</text><rect x='204' y='240.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='251.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>fournisseur B : 3 paquets de 4 (12 boîtes) × 8 $ = 24 $</text><rect x='204' y='263.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='274.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>fournisseur C : 1 paquet de 10 = 26 $</text><rect x='204' y='286.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='297.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>choix du fournisseur le moins cher : B, 24 $</text><path d='M204 315.0 L216 320.5 L204 326.0 L207.5 320.5 Z' fill='#1E1E1E'/><text x='224' y='326.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Le ruban</text><rect x='204' y='339.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='350.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>périmètre du dessus de la boîte (Ex. : 20 + 10 + 20 + 10 = 60 cm)</text><rect x='204' y='362.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='373.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>ruban pour une boîte (Ex. : 60 cm + 40 cm = 100 cm = 1 m)</text><rect x='204' y='385.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='396.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>boîtes par rouleau (5 m, donc 5 boîtes)</text><rect x='204' y='408.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='419.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>rouleaux (Ex. : 10 boîtes, donc 2 rouleaux; 2 × 2 $ = 4 $)</text><path d='M204 437.0 L216 442.5 L204 448.0 L207.5 442.5 Z' fill='#1E1E1E'/><text x='224' y='448.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='14.5' fill='#1E1E1E'>Les étiquettes</text><rect x='204' y='461.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='472.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>choix de l’étiquette 1, le carré (4 côtés de même longueur et 4 angles</text><text x='224' y='493.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>droits)</text><rect x='204' y='505.0' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='516.0' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>paquets (Ex. : 10 étiquettes, donc 2 paquets; 2 × 2 $ = 4 $)</text><text x='204' y='549.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E' stroke="#1E1E1E" stroke-width="0.7" >établit le coût total :</text><rect x='204' y='561.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='572.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>coût de la préparation (Ex. : 24 $ + 4 $ + 4 $ = 32 $)</text><text x='95.0' y='295.75' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>Mobilisation des</text><text x='95.0' y='317.75' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>concepts et processus</text><rect x='0' y='619.5' width='720' height='93.0' fill='#fff' stroke='#1E1E1E' stroke-width='1.5'/><line x1='190' y1='619.5' x2='190' y2='712.5' stroke='#1E1E1E' stroke-width='1.5'/><rect x='204' y='626.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='637.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>Laisse des traces de chacune des étapes</text><rect x='204' y='649.5' width='11' height='11' fill='#fff' stroke='#1E1E1E' stroke-width='1.2'/><text x='224' y='660.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>La solution comprend le nombre de boîtes (10) et le coût de la</text><text x='224' y='681.5' font-family='KG Perfect Penmanship' font-size='14.5' fill='#1E1E1E'>préparation des boîtes (32 $)</text><text x='95.0' y='649.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>Explicitation des</text><text x='95.0' y='671.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>éléments pertinents de</text><text x='95.0' y='693.0' font-family='KG Perfect Penmanship' stroke='#1E1E1E' stroke-width='0.7' font-size='16' text-anchor='middle' fill='#1E1E1E'>la solution</text></svg>